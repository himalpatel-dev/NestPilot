
name: Deploy NestPilot Backend

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" << 'EOF'

              set -e

              cd /var/www/nestpilot/NestPilot/NestPilot-backend

              echo "Pulling latest code..."
              git pull --ff-only origin main

              echo "Installing dependencies..."
              npm install --omit=dev

              echo "Restarting API..."
              pm2 restart nestpilot-api --update-env

              pm2 save

              echo "Deployment completed successfully!"

          EOF
